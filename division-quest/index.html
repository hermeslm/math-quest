<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Division Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Text marked with data-i18n (textContent), data-i18n-html (innerHTML) or
       data-i18n-title (title + aria-label) comes from js/lang/<lang>.js -->
  <header class="topbar">
    <button class="logo" id="go-home" data-i18n="appName" data-i18n-title="home"></button>
    <div class="top-actions">
      <button class="lang-btn" id="lang-btn"></button>
      <button class="icon-btn" id="sound-btn" data-i18n-title="soundToggle">🔊</button>
    </div>
  </header>

  <!-- HOME -->
  <main id="home" class="screen">
    <section class="hero">
      <div class="mascot">🦉</div>
      <div class="bubble">
        <h1 data-i18n="hello"></h1>
        <p data-i18n-html="intro"></p>
      </div>
    </section>
    <div id="lesson-grid" class="lesson-grid"></div>
  </main>

  <!-- QUIZ -->
  <main id="quiz" class="screen" hidden>
    <div class="quiz-head">
      <span id="q-lesson" class="pill"></span>
      <span id="q-count"></span>
      <span id="q-score" class="pill score"></span>
    </div>
    <div class="progress"><div id="q-progress"></div></div>

    <section class="card question-card">
      <p id="q-prompt" class="prompt"></p>
      <div id="q-visual"></div>
      <div id="q-answer" class="answer-area"></div>
      <div id="q-feedback" class="feedback" aria-live="polite"></div>
      <div id="q-hint" class="hint" hidden></div>
      <div id="q-steps" class="steps" hidden></div>
      <div class="actions">
        <button id="hint-btn" class="btn ghost" data-i18n="hint"></button>
        <button id="check-btn" class="btn primary" data-i18n="check"></button>
        <button id="next-btn" class="btn primary" hidden></button>
      </div>
    </section>

    <div id="keypad" class="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="back" class="k-alt" data-i18n-title="erase">⌫</button><button data-k="0">0</button><button data-k="enter" class="k-go" data-i18n-title="check">✔</button>
    </div>
  </main>

  <!-- HELP AT HOME (parent guide) -->
  <main id="help" class="screen" hidden>
    <section class="card help-head">
      <div class="setup-icon" id="h-icon"></div>
      <div>
        <p class="pill-label" data-i18n="parentCorner"></p>
        <h2 id="h-title"></h2>
        <p id="h-about" class="muted"></p>
      </div>
    </section>

    <section class="card help-card">
      <h3 data-i18n="watchTogether"></h3>
      <div id="h-media" class="media-btns"></div>
      <ol class="guide" id="h-guide"></ol>
    </section>

    <section class="card help-card" id="h-mathhelp-card">
      <h3 data-i18n="mathHelp"></h3>
      <div id="h-mathhelp" class="rich"></div>
    </section>

    <section class="card help-card">
      <h3><span data-i18n="homeActivity"></span> <span id="h-act-title"></span></h3>
      <div id="h-activity" class="rich"></div>
    </section>

    <p class="source"><span data-i18n="source"></span> <a id="h-source" target="_blank" rel="noopener" data-i18n="sourceLink"></a></p>
    <div class="actions center">
      <button id="help-start" class="btn primary" data-i18n="startPractice"></button>
      <button id="help-back" class="btn ghost" data-i18n="allLessons"></button>
    </div>
  </main>

  <!-- RESULTS -->
  <main id="results" class="screen" hidden>
    <section class="card results-card">
      <div id="r-stars" class="big-stars"></div>
      <h2 id="r-title"></h2>
      <p id="r-score" class="r-score"></p>
      <div class="actions center">
        <button id="again-btn" class="btn primary" data-i18n="newTest"></button>
        <button id="menu-btn" class="btn ghost" data-i18n="pickLesson"></button>
      </div>
    </section>
    <h3 class="review-title" data-i18n="review"></h3>
    <div id="r-review"></div>
  </main>

  <!-- LESSON SETUP DIALOG -->
  <dialog id="setup">
    <form method="dialog" class="setup-form">
      <div class="setup-icon" id="s-icon"></div>
      <h2 id="s-title"></h2>
      <p id="s-about"></p>
      <p class="label" data-i18n="howMany"></p>
      <div class="count-pick" id="count-pick">
        <button type="button" data-n="5">5</button>
        <button type="button" data-n="10" class="on">10</button>
        <button type="button" data-n="15">15</button>
        <button type="button" data-n="20">20</button>
      </div>
      <div class="actions center">
        <button type="button" id="start-btn" class="btn primary" data-i18n="start"></button>
        <button type="button" id="print-btn" class="btn ghost" data-i18n="print"></button>
      </div>
      <div class="actions center" id="setup-help">
        <button type="button" id="help-btn" class="btn ghost" data-i18n="helpAtHome"></button>
        <a id="anim-btn" class="btn ghost" target="_blank" rel="noopener" data-i18n="lessonAnimation"></a>
      </div>
      <button value="cancel" class="close-x" data-i18n-title="close">✕</button>
    </form>
  </dialog>

  <div id="print-area"></div>

  <script src="js/lang/en.js"></script>
  <script src="js/lang/es.js"></script>
  <script src="js/lesson-help.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
